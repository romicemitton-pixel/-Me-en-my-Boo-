
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couple Quest Online ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080810;color:#eee;font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:auto;padding:24px}
section{background:#11111d;border:1px solid #29293d;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 10px 40px #0008}
h1{font-size:34px;margin-top:5px}
h2{line-height:1.4}
p{line-height:1.6}
.muted{color:#999}
input,button{width:100%;padding:14px;margin:7px 0;border-radius:14px;border:1px solid #333;background:#171725;color:#fff;font-size:16px}
button{background:#8b5cf6;border:0;font-weight:700;cursor:pointer}
button:disabled{cursor:default;opacity:.6}
button.secondary{background:#252538}
.choices button{background:#171725;text-align:left;border:1px solid #333;transition:.2s}
.choices button:hover{border-color:#8b5cf6}
.hidden{display:none!important}
.code{font-size:32px;letter-spacing:8px;text-align:center;font-weight:900;overflow-wrap:anywhere}
.answers{display:grid;gap:10px}
.answer{padding:16px;border-radius:15px;background:#191929;line-height:1.6}
.same{border:1px solid #e879f9}
.tag{font-size:12px;color:#aaa;margin-bottom:6px}
.pill{display:inline-block;background:#24243a;padding:7px 10px;border-radius:999px;margin:3px;font-size:13px}
hr{border:0;border-top:1px solid #29293d;margin:22px 0}
.small{font-size:13px;color:#999}
</style>
</head>

<body>
<main>

<section id="home">
<h1>🌌 Couple Quest</h1>
<p class="muted">A private two-player midnight adventure for you &amp; babe. ❤️</p>

<input id="name" maxlength="24" placeholder="Your name" autocomplete="nickname">
<button onclick="createRoom()">💞 Create a Room</button>

<hr>

<input id="room" maxlength="6" placeholder="Room code" autocomplete="off">
<button class="secondary" onclick="joinRoom()">🔑 Join Room</button>

<p id="status" class="muted" role="status"></p>
<p class="small">Both players need an internet connection. Share your room code privately.</p>
</section>

<section id="lobby" class="hidden">
<h2>🌙 Waiting for your person ❤️</h2>
<p class="muted">Your room code is:</p>
<div class="code" id="code"></div>
<button class="secondary" onclick="copyRoomCode()">📋 Copy Room Code</button>
<p class="muted">Send this code to your babe so they can join.</p>
<p id="players">⏳ Waiting for your person...</p>
<p id="lobbyStatus" class="muted"></p>
</section>

<section id="game" class="hidden">
<div>
<span class="pill" id="chapter"></span>
<span class="pill" id="progress"></span>
</div>

<h2 id="q"></h2>
<div class="choices" id="choices"></div>
<p id="wait" class="muted" role="status"></p>
</section>

<section id="reveal" class="hidden">
<h2>😂 REVEAL!</h2>
<div class="answers" id="answers"></div>
<p id="nextStatus" class="muted"></p>
<button id="nextBtn" onclick="nextQuestion()">Next question ➜</button>
</section>

</main>

<script>
'use strict';

/* SUPABASE CONFIGURATION */
const SUPABASE_URL = 'https://avvrihqqdwifbefrhxps.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3ROEpokSsZElLVtAbxSXAw_i8G8BG6I';

const ready =
  typeof window.supabase !== 'undefined' &&
  SUPABASE_URL.startsWith('https://') &&
  SUPABASE_KEY.startsWith('sb_publishable_');

const sb = ready
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

/* COUPLE QUEST QUESTIONS */
const qs = [
['🌱 Getting to Know Me','What was your first impression of me?',['😍 “Cute… I might like them.”','😂 “This person is trouble.”','🫣 “Why am I shy already?”','🤨 “Let me observe first.”']],
['🌱 Getting to Know Me','What makes me smile the fastest?',['💬 A sweet message from you','😂 Your funniest nonsense','🫂 A surprise cuddle','🥹 You remembering little things']],
['🌱 Getting to Know Me','If we had one free evening together, what would I choose?',['🌃 A late-night drive','🍔 Food and deep talks','🎬 A movie under blankets','🚶 A random adventure']],
['🌱 Getting to Know Me','What would I probably do after a tiny argument?',['😂 Pretend I am completely fine','🥺 Come back for a cuddle','💬 Try to talk it out','😏 Make you laugh first']],
['😂 Couple Chaos','Who would survive a zombie apocalypse longer?',['🧟 Me — survival instincts','😂 You — pure accidental luck','😭 Neither — we would panic','❤️ We survive together']],
['😂 Couple Chaos','If I stole your food, what would I say?',['😇 “I thought it was mine.”','😂 “Sharing is caring.”','😭 “I was hungry!”','😏 “You looked too delicious.”']],
['😂 Couple Chaos','Who is more likely to start a pointless argument?',['🙋 Definitely me','😂 Definitely you','🤝 Both of us equally','😈 Whoever is bored first']],
['😂 Couple Chaos','If we got lost on a date, what happens next?',['📍 I open Maps immediately','😂 We blame each other','🚗 We explore anyway','❤️ We call it part of the date']],
['💌 Secret Hearts','What makes you feel most loved by me?',['🫂 My affection','💬 My words','🕐 My time and attention','🥹 My little thoughtful things']],
['💌 Secret Hearts','Which memory of us would you replay tonight?',['😂 A ridiculous moment','🥰 A sweet romantic moment','🫶 A quiet moment together','📸 One of our favorite pictures']],
['💌 Secret Hearts','What do you secretly want more of from us?',['💬 More deep conversations','😂 More silly moments','🫂 More affection','🌙 More late-night time']],
['💌 Secret Hearts','When do you feel closest to me?',['🌙 During late-night talks','😂 When we laugh uncontrollably','❤️ When we reassure each other','🤍 When we simply stay together']],
['🔥 Dare or Confess','Which confession would be hardest to say out loud?',['🥹 “I miss you badly.”','😍 “I still get butterflies.”','🫣 “I get jealous sometimes.”','❤️ “I can see a future with you.”']],
['🔥 Dare or Confess','Which dare would you actually choose right now?',['🎤 Send me a dramatic voice note','😂 Make your funniest selfie','💋 Send your flirtiest message','🕺 Do a ridiculous 10-second dance']],
['🔥 Dare or Confess','What would make you blush fastest?',['😍 A serious compliment','🫣 A sudden romantic confession','😂 A teasing message','💋 A very flirty voice note']],
['🌎 Our Future','Which future date sounds most like us?',['🌃 City lights and dinner','🏕️ Camping under stars','✈️ Exploring another country','🌊 Beach day with no schedule']],
['🌎 Our Future','What should we put first on our couple bucket list?',['✈️ Take a trip together','📸 Make a photo memory book','🍽️ Try a fancy restaurant','🌌 Watch a sunrise somewhere beautiful']],
['🌎 Our Future','If we could teleport anywhere tomorrow, where are we going?',['🇬🇧 Somewhere in the UK','🏝️ A quiet tropical island','🇫🇷 Paris for the romance','🏔️ A place neither of us knows']],
['🌎 Our Future','What kind of couple do you want us to become?',['😂 The chaotic funny couple','❤️ The soft romantic couple','🤝 The unstoppable team','🌌 The couple with endless stories']],
['🌌 Our Little Universe','What should our little universe always have?',['😂 Inside jokes nobody understands','❤️ Lots of affection','📸 Memories everywhere','🌙 Peace when the world gets loud']],
['🌌 Our Little Universe','What would make tonight unforgettable?',['💬 One honest conversation','😂 Laughing until we hurt','🥹 Saying what we usually hide','🌙 Staying up way too late together']],
['🌌 Our Little Universe','If our relationship had a soundtrack, what would it feel like?',['🎶 Soft and romantic','🔥 Flirty and energetic','🌧️ Emotional and dreamy','😂 Chaotic but happy']],
['🌌 Our Little Universe','What should our final Couple Quest reward be?',['💌 A secret love letter','😂 A ridiculous couple challenge','🌟 A future date promise','🫶 A message from both hearts']]
];

/* GAME STATE */
let me = '';
let roomId = '';
let channel = null;
let isHost = false;
let started = false;
let qi = 0;
let myChoice = null;
let otherChoice = null;
let otherName = 'Babe';
let locked = false;
let roomStartedAt = 0;

function el(id) {
  return document.getElementById(id);
}

function msg(message) {
  el('status').textContent = message;
}

function makeCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function showOnly(id) {
  ['home', 'lobby', 'game', 'reveal'].forEach(section => {
    el(section).classList.toggle('hidden', section !== id);
  });
}

function validSetup() {
  if (!ready) {
    msg('⚙️ Supabase did not load. Check your internet connection and configuration.');
    return false;
  }
  return true;
}

async function createRoom() {
  if (channel) {
    msg('You are already in a room. Refresh the page to start again.');
    return;
  }
  if (!validSetup()) return;

  me = el('name').value.trim().slice(0, 24) || 'You';
  roomId = makeCode();
  isHost = true;
  roomStartedAt = Date.now();

  await enterRoom();
}

async function joinRoom() {
  if (channel) {
    msg('You are already in a room. Refresh the page to start again.');
    return;
  }
  if (!validSetup()) return;

  me = el('name').value.trim().slice(0, 24) || 'Babe';
  roomId = el('room').value.trim().toUpperCase();

  if (!/^[A-Z0-9]{6}$/.test(roomId)) {
    msg('Enter the six-character room code your person shared ❤️');
    return;
  }

  isHost = false;
  roomStartedAt = Date.now();

  await enterRoom();
}

async function sendEvent(event, payload) {
  if (!channel) return;
  const result = await channel.send({
    type: 'broadcast',
    event,
    payload
  });

  if (result !== 'ok') {
    console.warn('Supabase broadcast status:', result);
  }
}

async function enterRoom() {
  showOnly('lobby');
  el('code').textContent = roomId;
  el('players').textContent = isHost
    ? '⏳ Waiting for your person to join...'
    : '🔎 Connecting to the room...';
  el('lobbyStatus').textContent = '';

  channel = sb.channel('game:' + roomId, {
    config: {
      broadcast: { self: false, ack: true }
    }
  });

  channel
    .on('broadcast', { event: 'player' }, async ({ payload }) => {
      if (isHost && payload.name && !started) {
        otherName = String(payload.name).slice(0, 24);
        el('players').textContent = '❤️ ' + otherName + ' is here!';

        started = true;
        await sendEvent('start', {
          host: me,
          guest: otherName,
          time: Date.now()
        });

        startQuestion();
      }
    })
    .on('broadcast', { event: 'start' }, ({ payload }) => {
      if (!isHost && !started) {
        started = true;
        otherName = String(payload.host || 'Your person').slice(0, 24);
        el('players').textContent = '💞 Connected! Let the quest begin.';
        startQuestion();
      }
    })
    .on('broadcast', { event: 'choice' }, ({ payload }) => {
      if (payload.name === me) return;
      if (payload.qi !== qi || !Number.isInteger(payload.choice)) return;
      if (payload.choice < 0 || payload.choice > 3) return;

      otherName = String(payload.name || otherName).slice(0, 24);
      otherChoice = payload.choice;

      if (myChoice !== null) {
        reveal();
      } else {
        el('wait').textContent = '❤️ ' + otherName + ' has answered! Your turn.';
      }
    })
    .on('broadcast', { event: 'next' }, ({ payload }) => {
      if (isHost) return;
      if (!Number.isInteger(payload.qi)) return;
      if (payload.qi < 0 || payload.qi >= qs.length) return;

      qi = payload.qi;
      myChoice = null;
      otherChoice = null;
      locked = false;
      showQuestion();
    })
    .on('broadcast', { event: 'finish' }, () => {
      if (!isHost) finishQuest();
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        el('lobbyStatus').textContent = '✅ Connected to Supabase.';

        if (isHost) {
          el('players').textContent = '⏳ Waiting for your person to join...';
        } else {
          await sendEvent('player', { name: me });
          el('players').textContent = '📡 Looking for the host...';
        }
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        el('lobbyStatus').textContent =
          '⚠️ Could not connect. Check Supabase Realtime settings and try refreshing.';
      } else if (status === 'CLOSED') {
        el('lobbyStatus').textContent = 'The room connection has closed.';
      }
    });
}

async function copyRoomCode() {
  try {
    await navigator.clipboard.writeText(roomId);
    el('lobbyStatus').textContent = '✅ Room code copied!';
  } catch {
    el('lobbyStatus').textContent = 'Your room code is ' + roomId + '. Copy it manually.';
  }
}

function startQuestion() {
  qi = 0;
  myChoice = null;
  otherChoice = null;
  locked = false;
  showQuestion();
}

function showQuestion() {
  if (qi >= qs.length) {
    finishQuest();
    return;
  }

  showOnly('game');

  const question = qs[qi];
  el('chapter').textContent = question[0];
  el('progress').textContent = (qi + 1) + ' / ' + qs.length;
  el('q').textContent = question[1];
  el('wait').textContent = '';
  el('choices').replaceChildren();

  question[2].forEach((answer, index) => {
    const button = document.createElement('button');
    button.textContent = answer;
    button.onclick = () => choose(index);
    button.disabled = locked;
    el('choices').appendChild(button);
  });
}

async function choose(index) {
  if (locked || myChoice !== null || !channel || !started) return;
  if (!Number.isInteger(index) || index < 0 || index > 3) return;

  myChoice = index;
  locked = true;

  [...el('choices').querySelectorAll('button')].forEach((button, i) => {
    button.disabled = true;
    button.style.opacity = i === index ? '1' : '.45';
    button.style.border = i === index ? '1px solid #e879f9' : '1px solid #333';
  });

  await sendEvent('choice', {
    name: me,
    choice: index,
    qi
  });

  if (otherChoice === null) {
    el('wait').textContent = '⏳ Waiting for your person to answer...';
  } else {
    reveal();
  }
}

function reveal() {
  if (myChoice === null || otherChoice === null) return;

  showOnly('reveal');

  const question = qs[qi];
  const same = myChoice === otherChoice;

  el('answers').replaceChildren();

  function makeAnswerCard(label, answer, matching) {
    const card = document.createElement('div');
    card.className = 'answer' + (matching ? ' same' : '');

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = label + (matching ? ' 💞 SAME ANSWER!' : '');

    const content = document.createElement('div');
    content.textContent = answer;

    card.append(tag, content);
    return card;
  }

  el('answers').append(
    makeAnswerCard('YOU', question[2][myChoice], same),
    makeAnswerCard(otherName.toUpperCase(), question[2][otherChoice], same)
  );

  const reaction = document.createElement('p');
  reaction.textContent = same
    ? '😂😂 You two actually think alike!'
    : '😭 Different answers! Now argue about it lovingly.';
  el('answers').appendChild(reaction);

  el('nextBtn').disabled = !isHost;
  el('nextBtn').textContent = isHost
    ? (qi === qs.length - 1 ? 'Finish our quest ❤️' : 'Next question ➜')
    : '⏳ Waiting for the host...';

  el('nextStatus').textContent = isHost
    ? 'You control when the next question begins.'
    : 'Your person will start the next question.';
}

async function nextQuestion() {
  if (!isHost || myChoice === null || otherChoice === null) return;

  if (qi >= qs.length - 1) {
    await sendEvent('finish', { name: me });
    finishQuest();
    return;
  }

  qi++;
  myChoice = null;
  otherChoice = null;
  locked = false;

  await sendEvent('next', { name: me, qi });
  showQuestion();
}

function finishQuest() {
  showOnly('reveal');

  el('answers').replaceChildren();

  const heading = document.createElement('h2');
  heading.textContent = '🌌 Quest Complete!';

  const first = document.createElement('p');
  first.textContent = 'You survived the questions, chaos, confessions and future planning.';

  const second = document.createElement('p');
  second.textContent = '❤️ Two people. One little universe.';

  el('answers').append(heading, first, second);
  el('nextStatus').textContent = 'Take a screenshot together to remember your answers.';

  el('nextBtn').textContent = '💞 Play Again';
  el('nextBtn').disabled = false;
  el('nextBtn').onclick = () => location.reload();
}
</script>
</body>
</html>
