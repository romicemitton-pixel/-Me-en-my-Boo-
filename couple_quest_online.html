<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Couple Quest Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080810;color:#eee;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px}section{background:#11111d;border:1px solid #29293d;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 10px 40px #0008}h1{font-size:34px}.muted{color:#999}input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:14px;border:1px solid #333;background:#171725;color:#fff;font-size:16px}button{background:#8b5cf6;border:0;font-weight:700}button.secondary{background:#252538}.choices button{background:#171725;text-align:left}.choices button:hover{border-color:#8b5cf6}.hidden{display:none}.code{font-size:32px;letter-spacing:8px;text-align:center;font-weight:900}.answers{display:grid;gap:10px}.answer{padding:16px;border-radius:15px;background:#191929}.same{border:1px solid #e879f9}.tag{font-size:12px;color:#aaa}.pill{display:inline-block;background:#24243a;padding:7px 10px;border-radius:999px;margin:3px}</style></head><body><main>
<section id="home"><h1>🌌 Couple Quest</h1><p class="muted">A private two-player midnight adventure for you & babe.</p><input id="name" placeholder="Your name"><button onclick="createRoom()">💞 Create a Room</button><hr><input id="room" placeholder="Room code"><button class="secondary" onclick="joinRoom()">🔑 Join Room</button><p id="status" class="muted"></p></section>
<section id="lobby" class="hidden"><h2>Waiting for your person ❤️</h2><div class="code" id="code"></div><p class="muted">Send this code to your babe. When she joins, the quest starts.</p><p id="players"></p></section>
<section id="game" class="hidden"><div><span class="pill" id="chapter"></span><span class="pill" id="progress"></span></div><h2 id="q"></h2><div class="choices" id="choices"></div><p id="wait" class="muted"></p></section>
<section id="reveal" class="hidden"><h2>😂 REVEAL!</h2><div class="answers" id="answers"></div><button onclick="nextQuestion()">Next question ➜</button></section>
</main><script>
const SUPABASE_URL='PASTE_YOUR_SUPABASE_URL_HERE',SUPABASE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';
const ready=!SUPABASE_URL.startsWith('PASTE_');let sb=ready?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const qs=[
['🌱 Getting to Know Me','What was your first impression of me?',['😍 “Cute… I might like them.”','😂 “This person is trouble.”','🫣 “Why am I shy already?”','🤨 “Let me observe first.”']],
['🌱 Getting to Know Me','What makes me smile the fastest?',['💬 A sweet message from you','😂 Your funniest nonsense','🫂 A surprise cuddle','🥹 You remembering little things']],
['🌱 Getting to Know Me','If we had one free evening together, what would I choose?',['🌃 A late-night drive','🍔 Food and deep talks','🎬 A movie under blankets','🚶 A random adventure']],
['🌱 Getting to Know Me','What would I probably do after a tiny argument?',['😂 Pretend I am completely fine','🥺 Come back for a cuddle','💬 Try to talk it out','😏 Make you laugh first']],
['😂 Couple Chaos','Who would survive a zombie apocalypse longer?',['🧟 Me — survival instincts','😂 You — pure accidental luck','😭 Neither — we would panic','❤️ We survive together']],
['😂 Couple Chaos','If I stole your food, what would I say?',['😇 “I thought it was mine.”','😂 “Sharing is caring.”','😭 “I was hungry!”','😏 “You looked too delicious.”']],
['😂 Couple Chaos','Who is more likely to start a pointless argument?',['🙋 Definitely me','😂 Definitely you','🤝 Both of us equally','😈 Whoever is bored first']],
['😂 Couple Chaos','If we got lost on a date, what happens next?',['📍 I open Maps immediately','😂 We blame each other','🚗 We explore anyway','❤️ We call it part of the date']],
['💌 Secret Hearts','What makes you feel most loved by me?',['🫂 My affection','💬 My words','🕐 My time and attention','🥹 My little thoughtful things']],
['💌 Secret Hearts','Which memory of us would you replay tonight?',['😂 A ridiculous moment','🥰 A sweet romantic moment','🫶 A quiet moment together','📸 One of our favorite pictures']],
['💌 Secret Hearts','What do you secretly want more of from us?',['💬 More deep conversations','😂 More silly moments','🫂 More affection','🌙 More late-night time']],
['💌 Secret Hearts','When do you feel closest to me?',['🌙 During late-night talks','😂 When we laugh uncontrollably','❤️ When we reassure each other','🤍 When we simply stay together']],
['🔥 Dare or Confess','Which confession would be hardest to say out loud?',['🥹 “I miss you badly.”','😍 “I still get butterflies.”','🫣 “I get jealous sometimes.”','❤️ “I can see a future with you.”']],
['🔥 Dare or Confess','Which dare would you actually choose right now?',['🎤 Send me a dramatic voice note','😂 Make your funniest selfie','💋 Send your flirtiest message','🕺 Do a ridiculous 10-second dance']],
['🔥 Dare or Confess','What would make you blush fastest?',['😍 A serious compliment','🫣 A sudden romantic confession','😂 A teasing message','💋 A very flirty voice note']],
['🌎 Our Future','Which future date sounds most like us?',['🌃 City lights and dinner','🏕️ Camping under stars','✈️ Exploring another country','🌊 Beach day with no schedule']],
['🌎 Our Future','What should we put first on our couple bucket list?',['✈️ Take a trip together','📸 Make a photo memory book','🍽️ Try a fancy restaurant','🌌 Watch a sunrise somewhere beautiful']],
['🌎 Our Future','If we could teleport anywhere tomorrow, where are we going?',['🇬🇧 Somewhere in the UK','🏝️ A quiet tropical island','🇫🇷 Paris for the romance','🏔️ A place neither of us knows']],
['🌎 Our Future','What kind of couple do you want us to become?',['😂 The chaotic funny couple','❤️ The soft romantic couple','🤝 The unstoppable team','🌌 The couple with endless stories']],
['🌌 Our Little Universe','What should our little universe always have?',['😂 Inside jokes nobody understands','❤️ Lots of affection','📸 Memories everywhere','🌙 Peace when the world gets loud']],
['🌌 Our Little Universe','What would make tonight unforgettable?',['💬 One honest conversation','😂 Laughing until we hurt','🥹 Saying what we usually hide','🌙 Staying up way too late together']],
['🌌 Our Little Universe','If our relationship had a soundtrack, what would it feel like?',['🎶 Soft and romantic','🔥 Flirty and energetic','🌧️ Emotional and dreamy','😂 Chaotic but happy']],
['🌌 Our Little Universe','What should our final Couple Quest reward be?',['💌 A secret love letter','😂 A ridiculous couple challenge','🌟 A future date promise','🫶 A message from both hearts']]
];
let me='',roomId='',channel=null,qi=0,myChoice=null,otherChoice=null,otherName='Babe';
function msg(x){document.getElementById('status').textContent=x}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function createRoom(){me=document.getElementById('name').value.trim()||'You';if(!ready)return msg('⚙️ Add your Supabase URL + publishable key in the code first.');roomId=makeCode(); await enterRoom(true)}
async function joinRoom(){me=document.getElementById('name').value.trim()||'Babe';roomId=document.getElementById('room').value.trim().toUpperCase();if(!roomId)return msg('Enter the room code 😭');if(!ready)return msg('⚙️ Add your Supabase URL + publishable key in the code first.');await enterRoom(false)}
async function enterRoom(host){document.getElementById('home').classList.add('hidden');document.getElementById('lobby').classList.remove('hidden');document.getElementById('code').textContent=roomId;channel=sb.channel('game:'+roomId);channel.on('broadcast',{event:'player'},({payload})=>{if(payload.name!==me){otherName=payload.name;document.getElementById('players').textContent='❤️ '+otherName+' is here!';if(host)startQuestion();}}).on('broadcast',{event:'choice'},({payload})=>{if(payload.name!==me){otherChoice=payload.choice;document.getElementById('wait').textContent='❤️ '+otherName+' has answered!';if(myChoice!==null)reveal();}}).on('broadcast',{event:'next'},({payload})=>{if(payload.name!==me){qi=payload.qi;myChoice=null;otherChoice=null;showQuestion();}}).subscribe(async s=>{if(s==='SUBSCRIBED'){await channel.send({type:'broadcast',event:'player',payload:{name:me}});if(!host)document.getElementById('players').textContent='⏳ Waiting for the host to start…';}})}
function startQuestion(){qi=0;showQuestion()}
function showQuestion(){document.getElementById('lobby').classList.add('hidden');document.getElementById('reveal').classList.add('hidden');document.getElementById('game').classList.remove('hidden');let x=qs[qi];document.getElementById('chapter').textContent=x[0];document.getElementById('progress').textContent=(qi+1)+' / '+qs.length;document.getElementById('q').textContent=x[1];document.getElementById('wait').textContent='';document.getElementById('choices').innerHTML=x[2].map((a,i)=>`<button onclick="choose(${i})">${a}</button>`).join('')}
async function choose(i){if(myChoice!==null)return;myChoice=i;document.querySelectorAll('#choices button').forEach((b,j)=>{b.disabled=true;b.style.opacity=j===i?'1':'.45'});await channel.send({type:'broadcast',event:'choice',payload:{name:me,choice:i}});if(otherChoice===null)document.getElementById('wait').textContent='⏳ Waiting for your person…';else reveal()}
function reveal(){document.getElementById('game').classList.add('hidden');document.getElementById('reveal').classList.remove('hidden');let x=qs[qi],same=myChoice===otherChoice;document.getElementById('answers').innerHTML=`<div class="answer ${same?'same':''}"><div class="tag">YOU ${same?'💞 SAME ANSWER!':''}</div>${x[2][myChoice]}</div><div class="answer ${same?'same':''}"><div class="tag">${otherName.toUpperCase()} ${same?'💞 SAME ANSWER!':''}</div>${x[2][otherChoice]}</div>${same?'<p>😂😂 You two actually think alike!</p>':'<p>😭 Different answers! Now argue about it lovingly.</p>'}`}
async function nextQuestion(){if(qi>=qs.length-1){document.getElementById('reveal').innerHTML='<h2>🌌 Quest Complete!</h2><p>You survived the questions, chaos, confessions and future planning.</p><p>❤️ Two people. One little universe.</p>';return}qi++;myChoice=null;otherChoice=null;await channel.send({type:'broadcast',event:'next',payload:{name:me,qi}});showQuestion()}
</script></body></html>
