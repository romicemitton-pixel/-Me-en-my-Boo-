<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Couple Quest ❤️</title><style>
:root{--bg:#070912;--p:#111729;--p2:#181e31;--t:#f8f8fc;--m:#aab0c4;--a:#f2a6c4;--b:#bbaeff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#242740,#070912 48%);color:var(--t);font-family:system-ui,Segoe UI,sans-serif}.wrap{max-width:900px;width:94%;margin:auto;padding:28px 0 50px}.hero{text-align:center;padding:15px}.moon{font-size:52px}.hero h1{font-size:clamp(34px,7vw,58px);margin:5px}.hero p{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.panel{background:#111729eF;border:1px solid #292f46;border-radius:20px}.stat{text-align:center;padding:12px}.stat b{display:block;font-size:20px}.stat small{color:var(--m)}.panel{padding:20px;margin-top:13px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.label{color:var(--a);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.bar{height:8px;background:#292f45;border-radius:20px;margin-top:13px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:.3s}.q{font-size:clamp(22px,4vw,32px);line-height:1.2;margin:14px 0 7px}.hint{color:var(--m);font-size:13px;margin-bottom:16px}.answers{display:grid;gap:10px}.ans,.btn{min-height:48px;border:1px solid #343b52;background:var(--p2);color:var(--t);border-radius:14px;padding:12px 15px}.ans{text-align:left}.ans:hover{border-color:var(--a)}.btn{cursor:pointer}.primary{background:var(--a);color:#25131c;border:0;font-weight:800}.feedback{min-height:27px;color:#9fe0c0;font-weight:700;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ch{padding:14px;border:1px solid #292f46;border-radius:14px;background:#0d1220}.locked{opacity:.4}.current{border-color:var(--a)}.ch small{color:var(--m)}.center{text-align:center}.score{font-size:60px;font-weight:900;color:var(--a)}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.chs{grid-template-columns:1fr 1fr}}@media(max-width:390px){.chs{grid-template-columns:1fr}}
</style></head><body><div class='wrap'><header class='hero'><div class='moon'>🌙</div><h1>Couple Quest ❤️</h1><p>Two hearts. One adventure. Way too much chaos. 😂</p></header><div class='stats'><div class='stat'>❤️<b id='h'>0</b><small>HEARTS</small></div><div class='stat'>⭐<b id='s'>0</b><small>STARS</small></div><div class='stat'>🔥<b id='st'>0</b><small>STREAK</small></div><div class='stat'>🏆<b id='d'>0</b><small>COMPLETED</small></div></div><section class='panel'><div class='top'><div><div class='label' id='cl'>Chapter 1</div><b id='cn'>Getting to Know Me</b></div><button class='btn' id='reset'>Reset Quest</button></div><div class='bar'><div class='fill' id='fill'></div></div></section><main id='game'></main><section class='panel'><div class='label'>Your Journey</div><div class='chs' id='chs'></div></section></div><script>
const C=[
['🌱','Getting to Know Me',['What makes me smile fastest?','What is my ideal date?','What do I overthink most?','What fixes my bad day fastest?','What do I value most in us?','Where would I spend a free weekend?','What surprise would hit me hardest?','What is my most dangerous habit?','What would I spend unexpected money on?','What makes me feel loved?','What nickname would melt me?','What should we never lose?','Which word describes us?','What is my comfort activity?','What would I rather receive?','What do I notice first about you?','What memory do I dream of making?','If we had one free day, what are we doing?','What could I never get tired of?','Describe your partner using 3 emojis.']],
['😂','Couple Chaos',['Who survives a zombie apocalypse?','Who gets lost first?','Who spends the last KSh 500 on food?','Who apologizes first?','Who is more dramatic?','Who ruins surprises accidentally?','Who becomes famous accidentally?','Who laughs at the worst moment?','Beach or mountain?','Unlimited money or unlimited time together?','Horror all night or cuddles all night?','Who chooses the movie?','Pick our mascot.','Describe your partner as a product.','What should we have more of?','What business would we open?','Who wins a staring contest?','Pick our couple superpower.','Who gets arrested first?','Give your partner a ridiculous title.']],
['💌','Secret Hearts',['What do you love most about your partner?','Which memory would you replay?','What makes you feel closest?','When do you miss them most?','What do you hope you experience together?','What promise matters most?','What little thing feels like love?','What belongs in our time capsule?','When did you know they were special?','Pick one word for us.','What should your partner never doubt?','Choose a secret message to unlock later.','What deserves more attention?','What tiny moment do you treasure?','What should your partner remember forever?']],
['🔥','Dare or Confess',['What is extremely attractive about your partner?','What was your first impression?','DARE: Send a cute selfie.','DARE: Give your partner a new nickname.','What do you want more of?','DARE: Describe them without cute/beautiful/hot.','What could you improve together?','DARE: Write a 2-line love poem.','What makes you jealous?','DARE: Send a romantic voice note.','What is your perfect date?','DARE: Make them laugh in one message.','What were you afraid to say?','DARE: Send your best pickup line.','When did you realize this was different?']],
['🌎','Our Future',['Dream destination together?','Dream home?','First bucket-list priority?','Dream future date?','What must we do together?','Pick a future tradition.','What should our future contain?','Dream weekend?','What should we save for first?','What memory should we create next?','What place should become our place?','What should our future photos feel like?']],
['🌌','Our Little Universe',['What are we building together?','Choose your star.','One final promise?','What makes a relationship strong?','Complete: No matter where life takes us...','What should our universe always have?','Choose your forever symbol.','Final vibe?']]
];
const opts=[['Your message 💬','Food 😂','Seeing you ❤️','A surprise 🎁'],['Beach 🏖️','Mountain ⛰️','Both 🌍','Surprise me ❤️'],['Money 💸','Time ❤️','Both 😭','Adventure 🌍'],['Hug 🫂','Food 🍟','Your voice 🎧','A stupid joke 😂']];
let st={c:0,q:0,h:0,s:0,streak:0,d:0};try{Object.assign(st,JSON.parse(localStorage.cq||'{}'))}catch(e){};
const $=x=>document.getElementById(x);function unlock(i){return i===0||st.d>=[20,40,55,70,82][i-1]};function save(){try{localStorage.cq=JSON.stringify(st)}catch(e){}}function stats(){h.textContent=st.h;s.textContent=st.s;document.getElementById('st').textContent=st.streak;d.textContent=st.d}
function journey(){chs.innerHTML=C.map((x,i)=>`<div class='ch ${unlock(i)?'':'locked'} ${i===st.c?'current':''}'><b>${x[0]} Chapter ${i+1}</b><br><small>${unlock(i)?x[1]:'🔒 Complete '+[20,40,55,70,82][i-1]+' challenges'}</small></div>`).join('')}
function render(){stats();journey();let x=C[st.c],qs=x[2],q=qs[st.q];$('cl').textContent=x[0]+' Chapter '+(st.c+1);$('cn').textContent=x[1];fill.style.width=(st.q/qs.length*100)+'%';let os=opts[st.q%opts.length];if(st.c===5)os=[['❤️','∞','🌙','⭐'][0],['⭐','🌙','✨','🌌'][0],['Keep laughing 😂','Keep talking 💬','Keep choosing us ❤️','Make memories 🌙'],['Trust 🤝','Friendship 😂','Love ❤️','All three ❤️']][st.q%4];game.innerHTML=`<section class='panel'><div class='label'>${x[1]}</div><h2 class='q'>${q}</h2><div class='hint'>Pick the answer that feels right. There are no wrong answers ❤️</div><div class='answers'>${os.map((o,i)=>`<button class='ans' data-i='${i}'>${o}</button>`).join('')}</div><div class='feedback' id='fb'></div><div class='actions'><button class='btn' id='skip'>Skip</button></div></section>`;document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>choose(+b.dataset.i));skip.onclick=()=>next(true)}
function choose(i){document.querySelectorAll('.ans').forEach(b=>b.disabled=true);st.h++;st.d++;st.streak++;if(Math.random()<.7)st.s++;fb.textContent=['❤️ Added to your story!','✨ Nice choice!','😂 Interesting choice...','🌙 Another memory for the universe.'][Math.floor(Math.random()*4)];save();stats();journey();setTimeout(()=>next(false),450)}
function next(skip){if(skip)st.streak=0;st.q++;let qs=C[st.c][2];if(st.q>=qs.length){if(st.c<C.length-1){if(unlock(st.c+1)){st.c++;st.q=0}else{st.q=qs.length-1;fb.textContent='🔒 Complete more challenges to unlock the next chapter.';render();return}}else{finale();return}}save();render()}
function finale(){save();stats();journey();fill.style.width='100%';let rank=st.h>=82?'SOULMATES 🌌':st.h>=60?'POWER COUPLE ❤️':st.h>=40?'CHAOTIC DUO 😂':'ADVENTURE BUDDIES ⭐';game.innerHTML=`<section class='panel center'><div style='font-size:50px'>🌌❤️🌙</div><div class='label'>QUEST COMPLETE</div><div class='score'>${st.h} ❤️</div><h2>${rank}</h2><p>You completed ${st.d} challenges and collected ${st.s} Stars. The real score is the memories you make together.</p><div class='actions' style='justify-content:center'><button class='btn primary' id='again'>Play Again ❤️</button></div></section>`;again.onclick=()=>{st={c:0,q:0,h:0,s:0,streak:0,d:0};save();render()}}
reset.onclick=()=>{if(confirm('Reset all Couple Quest progress?')){st={c:0,q:0,h:0,s:0,streak:0,d:0};save();render()}};render();
</script></body></html>
